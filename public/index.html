<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biblioteca Central</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div><strong>Biblioteca Central</strong><small>Gestión de préstamos</small></div>
    </div>
    <nav id="nav" aria-label="Secciones">
      <a href="#panel">Panel</a>
      <a href="#prestamos">Préstamos</a>
      <a href="#libros">Libros</a>
      <a href="#autores">Autores</a>
      <a href="#categorias">Categorías</a>
      <a href="#socios">Socios</a>
    </nav>
  </aside>
  <main id="main" tabindex="-1"></main>

  <dialog id="dialog">
    <form id="form" novalidate>
      <h2 id="dialog-title"></h2>
      <div id="form-fields"></div>
      <p id="form-error" class="form-error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="cancel">Cancelar</button>
        <button type="submit" class="btn btn-primary" id="save">Guardar</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
